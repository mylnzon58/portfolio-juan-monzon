<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" fill="none">
  <rect width="1440" height="810" fill="#0D0D0F"/>
  <!-- Grilla arquitectónica de 8px escalada -->
  <g stroke="#1C1C20" stroke-width="1">
    <line x1="96" y1="0" x2="96" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="810"/>
    <line x1="960" y1="0" x2="960" y2="810"/>
    <line x1="1344" y1="0" x2="1344" y2="810"/>
    <line x1="0" y1="128" x2="1440" y2="128"/>
    <line x1="0" y1="405" x2="1440" y2="405"/>
    <line x1="0" y1="682" x2="1440" y2="682"/>
  </g>
  <!-- Marco de producto editorial -->
  <rect x="96" y="128" width="1248" height="554" fill="#111114" stroke="#242429" stroke-width="1.5"/>
  <line x1="96" y1="192" x2="1344" y2="192" stroke="#242429" stroke-width="1"/>
  <rect x="136" y="156" width="12" height="12" fill="#C6FF3D"/>
  <text x="164" y="167" fill="#EDEDED" font-family="monospace" font-size="16" letter-spacing="3">ANUNCERO.PRESS  //  SELF-SERVE ADTECH INFRASTRUCTURE</text>
  <text x="1156" y="167" fill="#8A8A8F" font-family="monospace" font-size="14" letter-spacing="2">EN PRODUCCIÓN</text>

  <!-- Composición tipográfica arquitectónica -->
  <text x="136" y="346" fill="#EDEDED" font-family="Georgia, serif" font-size="92" font-style="italic">Anuncero</text>
  <text x="136" y="400" fill="#8A8A8F" font-family="sans-serif" font-size="24">Compra y venta directa de pauta digital entre medios y anunciantes.</text>

  <!-- Diagrama esquemático de arquitectura (sin métricas inventadas) -->
  <rect x="136" y="472" width="320" height="148" fill="#0A0A0B" stroke="#242429"/>
  <text x="160" y="512" fill="#C6FF3D" font-family="monospace" font-size="13" letter-spacing="2">01 / MEDIOS</text>
  <text x="160" y="548" fill="#EDEDED" font-family="sans-serif" font-size="20">Inventario directo</text>
  <text x="160" y="582" fill="#8A8A8F" font-family="sans-serif" font-size="15">Espacios verificados sin intermediarios</text>

  <rect x="520" y="472" width="360" height="148" fill="#0A0A0B" stroke="#C6FF3D" stroke-width="1.5"/>
  <text x="544" y="512" fill="#C6FF3D" font-family="monospace" font-size="13" letter-spacing="2">02 / MOTOR SELF-SERVE</text>
  <text x="544" y="548" fill="#EDEDED" font-family="sans-serif" font-size="20">Reserva, cobro y entrega</text>
  <text x="544" y="582" fill="#8A8A8F" font-family="sans-serif" font-size="15">Flujo automatizado de punta a punta</text>

  <rect x="944" y="472" width="360" height="148" fill="#0A0A0B" stroke="#242429"/>
  <text x="968" y="512" fill="#C6FF3D" font-family="monospace" font-size="13" letter-spacing="2">03 / ANUNCIANTES</text>
  <text x="968" y="548" fill="#EDEDED" font-family="sans-serif" font-size="20">Publicación en minutos</text>
  <text x="968" y="582" fill="#8A8A8F" font-family="sans-serif" font-size="15">Control directo de campañas y creativos</text>

  <line x1="456" y1="546" x2="520" y2="546" stroke="#C6FF3D" stroke-width="1.5"/>
  <line x1="880" y1="546" x2="944" y2="546" stroke="#C6FF3D" stroke-width="1.5"/>
</svg>

